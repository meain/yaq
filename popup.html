<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="container">
      <div class="input-area">
        <div class="input-row">
          <button id="new-chat" class="new-chat-btn" title="New conversation">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <textarea id="text" placeholder="Ask anything..." rows="1"></textarea>
          <button id="send" class="send-btn" title="Send (Enter)">
            <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
            </svg>
          </button>
        </div>
        <div id="pills" class="pills-row"></div>
      </div>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <div class="bottom-bar">
      <button id="history-btn" class="bottom-icon-btn" title="History">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="history-count" class="badge"></span>
      </button>
      <button id="model-btn" class="bottom-icon-btn" title="Model">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span id="model-label" class="bottom-label"></span>
      </button>
      <button id="settings-btn" class="bottom-icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
      </button>
      <button id="export-btn" class="bottom-icon-btn" title="Export chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
      <span class="bottom-spacer"></span>
      <button id="info-btn" class="bottom-icon-btn" title="About Yaq">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </button>

      <div id="history-popup" class="popup" style="display:none">
        <div id="history-list" class="history-list"></div>
      </div>

      <div id="model-popup" class="popup" style="display:none">
        <div class="popup-inner">
          <div class="model-picker" id="model-picker">
            <input type="text" id="model" placeholder="Search models..." autocomplete="off" />
            <div id="model-dropdown" class="model-dropdown"></div>
          </div>
        </div>
      </div>

      <div id="settings-popup" class="popup" style="display:none">
        <div class="popup-inner">
          <label class="toggle-row">
            <input type="checkbox" id="yolo-mode" />
            <span>Yolo mode</span>
            <span class="toggle-hint">Auto-approve JS</span>
          </label>
        </div>
      </div>

      <div id="info-popup" class="popup" style="display:none">
        <div class="popup-inner info-content">
          <strong>Yaq</strong> <span class="info-version"></span>
          <p>Chat with any web page using LLMs.</p>
          <ul class="info-features">
            <li>Inspect page structure and read HTML</li>
            <li>Execute JavaScript on the page</li>
            <li>Inject and remove CSS styles</li>
            <li>Fetch YouTube subtitles</li>
            <li>OpenAI and Anthropic support</li>
          </ul>
          <div class="info-links">
            <span>Shortcut: <kbd>Ctrl+Shift+M</kbd></span>
            <span class="info-separator">·</span>
            <a href="https://github.com/meain/yaq" target="_blank" class="info-link">GitHub</a>
          </div>
        </div>
      </div>
    </div>

    <script src="showdown.min.js"></script>
    <script src="tools.js"></script>
    <script src="api.js"></script>
    <script src="history.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
