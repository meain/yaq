<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yaq Options</title>
    <style>
      :root {
        --radius: 6px;
        --accent: #1a1a2e;
        --accent-hover: #2d2d44;
        --surface: #f5f6f8;
        --border: #e0e2e6;
        --text: #1e1e1e;
        --text-muted: #6b7280;
        --bg: #fff;
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
        --transition: 150ms ease;
      }

      * { box-sizing: border-box; }

      body {
        font-family: var(--font);
        margin: 0;
        padding: 12px;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }

      label {
        display: block;
        margin: 8px 0 3px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 2px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        transition: border-color var(--transition), box-shadow var(--transition);
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(26,26,46,0.1);
      }

      input[type="text"]::placeholder {
        color: var(--text-muted);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 14px 0 6px 0;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }

      .section-header h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .button-config {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 8px;
        margin: 4px 0;
        background-color: var(--surface);
      }

      .button-row {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: space-between;
      }

      .button-row input {
        margin-bottom: 0;
        padding: 3px 6px;
        font-size: 12px;
      }

      .button-row input[name="button-name"] {
        width: 120px;
      }

      .button-prompt {
        width: 100%;
        height: 36px;
        resize: vertical;
        margin-top: 4px;
        padding: 4px 6px;
        font-family: var(--font);
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        transition: border-color var(--transition);
      }

      .button-prompt:focus {
        outline: none;
        border-color: var(--accent);
      }

      .reorder-btn {
        padding: 2px 4px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 11px;
        transition: all var(--transition);
      }

      .reorder-btn:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .add-button {
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        font-family: var(--font);
        font-size: 12px;
        background: var(--bg);
        color: var(--text);
        transition: all var(--transition);
      }

      .add-button:hover {
        background: var(--surface);
      }

      .toggle-option {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .toggle-option input[type="checkbox"] {
        accent-color: var(--accent);
        margin: 0;
      }

      .toggle-option-text {
        flex: 1;
      }

      .toggle-option-text strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }

      .toggle-option-text span {
        font-size: 11px;
        color: var(--text-muted);
      }

      #status {
        margin-top: 6px;
        padding: 4px;
        text-align: center;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
      }

      #save {
        width: 100%;
        padding: 8px;
        margin-top: 10px;
        background-color: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-family: var(--font);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color var(--transition);
      }

      #save:hover {
        background-color: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <h2>Yaq Options</h2>

    <label for="service">Service</label>
    <select id="service">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
    </select>

    <label for="key">API Key</label>
    <input type="text" id="key" placeholder="sk-..." />

    <label for="url">Endpoint</label>
    <input type="text" id="url" placeholder="https://api.openai.com/v1" />

    <div class="section-header">
      <h3>Quick Prompts</h3>
      <button type="button" class="add-button" id="add-button">+ Add</button>
    </div>
    <div id="buttons-container"></div>

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
